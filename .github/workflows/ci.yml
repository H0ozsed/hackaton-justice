# =============================================================================
# CI: checks run on every pull request to main (and on main itself).
# A red check means the PR breaks something: fix it before merging.
# See docs/TESTING.md.
# =============================================================================
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same PR cancels the previous, now outdated, run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: read-only access to the repository.
permissions:
  contents: read

env:
  # Keep in sync with "devEngines" in package.json, .nvmrc and the Dockerfile
  # (npm fails with EBADDEVENGINES otherwise).
  NODE_VERSION: 24
  NPM_VERSION: 12.2.0
  # Placeholder so Prisma can load its config without a real database.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, types, content & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Pin npm version
        # Outside the repository: devEngines would reject the runner's npm first.
        working-directory: ${{ runner.temp }}
        run: npm install -g npm@${{ env.NPM_VERSION }}

      # Not setup-node's `cache: npm`: it calls npm inside the repository before
      # npm 12 is installed, and devEngines rejects it.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      # postinstall runs `prisma generate` (client types needed by typecheck).
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Content
        run: npm run content:check

      - name: Unit & component tests
        run: npm test

  e2e:
    name: Build & E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Pin npm version
        working-directory: ${{ runner.temp }}
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # Production build: also proves the app builds. Playwright then serves it
      # with `next start` (CI=true, see playwright.config.ts).
      - name: Build
        run: npm run build

      # Chromium only, with its system dependencies.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      # On failure, keep the HTML report (screenshots, traces) for 7 days,
      # downloadable from the run summary.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
