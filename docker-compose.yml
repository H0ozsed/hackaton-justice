# =============================================================================
# docker-compose.yml: local PostgreSQL 18 for development.
#   npm run db:up   (= docker compose up -d db)
# Every ${...} value comes from the .env file (see .env.example).
# =============================================================================

name: hackaton-justice

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is missing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is missing}
    ports:
      # Published on 127.0.0.1 only: reachable from this machine, not the network.
      - '127.0.0.1:5432:5432'
    volumes:
      # Postgres 18+: mount /var/lib/postgresql (not .../data as in <= 17).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
