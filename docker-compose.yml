# =============================================================================
# docker-compose.yml: full DEVELOPMENT environment (app + database + Ollama).
#
#   docker compose up --build      # first run, or after a dependency change
#   docker compose up              # next runs
#   docker compose down            # stop (database data is kept)
#
# Every ${...} value comes from the .env file (see .env.example).
# The ${VAR:?message} syntax refuses to start if the variable is missing.
# =============================================================================

name: hackaton-justice

services:
  # ---------------------------------------------------------------------------
  # app: the Next.js server in dev mode
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
    image: hackaton-justice-dev
    env_file: .env
    environment:
      # Inside the Docker network the database is called `db` (service name),
      # not `localhost`: the URL is rebuilt here.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Same for Ollama: called `ollama` inside the Docker network.
      OLLAMA_URL: http://ollama:11434
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      # Your code is mounted into the container: hot reload on every save.
      - .:/app
      # node_modules stays INSIDE the container (anonymous volume): otherwise
      # the mount above would hide it with your machine's copy (missing or
      # built for another OS). After a dependency change:
      #   docker compose up --build --renew-anon-volumes
      - /app/node_modules
    depends_on:
      db:
        # Wait until Postgres ACCEPTS connections (healthcheck), not just until
        # its container is started: otherwise migrations fail.
        condition: service_healthy
    # In dev, a crashing container is not restarted: we want to see the error.
    restart: 'no'

  # ---------------------------------------------------------------------------
  # db: PostgreSQL 18
  # ---------------------------------------------------------------------------
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is missing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is missing}
    ports:
      # Reachable from YOUR machine only (Prisma Studio, DBeaver, psql...).
      - '127.0.0.1:5432:5432'
    volumes:
      # Postgres 18+: mount /var/lib/postgresql (not .../data as in <= 17).
      - pgdata:/var/lib/postgresql
    healthcheck:
      # $$ escapes the $: evaluated INSIDE the container, not by Compose.
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # ollama: local LLM server for the IRIS chatbot (no external API, no GPU needed)
  # The site works without it: IRIS then says it is unavailable.
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # Keep the chat model loaded between questions (faster answers).
      OLLAMA_KEEP_ALIVE: 30m
    ports:
      # Reachable from YOUR machine only, for `npm run dev` outside Docker.
      - '127.0.0.1:11434:11434'
    volumes:
      # Downloaded models survive `docker compose down`.
      - ollama:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------------
  # ollama-models: downloads the models once, then exits (already there = instant)
  # Override them in .env: OLLAMA_CHAT_MODEL, OLLAMA_EMBED_MODEL.
  # ---------------------------------------------------------------------------
  ollama-models:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
    entrypoint: ['sh', '-c', 'ollama pull "$$CHAT_MODEL" && ollama pull "$$EMBED_MODEL"']
    restart: 'no'

volumes:
  pgdata:
  ollama:
